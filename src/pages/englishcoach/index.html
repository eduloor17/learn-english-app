<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native English Coach</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4F46E5',
                        'secondary': '#10B981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        /* Light Theme is default: bg-gray-100 body, bg-white card */
        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* Custom spinner for loading state */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-pulse-mic {
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-xl bg-white p-6 md:p-8 rounded-xl card">
        <h1 class="text-3xl font-bold text-center text-primary mb-2">Native English Coach</h1>
        <p class="text-center text-gray-500 mb-6">Enter your phrase by speaking or typing to get instant native correction.</p>

        <!-- Input Mode Toggle -->
        <div class="flex border-b border-gray-200 mb-6">
            <button id="speakModeBtn" onclick="setInputMode('speak')" class="flex-1 py-3 text-lg font-medium border-b-2 transition duration-150 focus:outline-none">
                <span class="inline-flex items-center">
                    <!-- Mic Icon for Speak -->
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 8c1.66 0 3-1.34 3-3V3c0-1.66-1.34-3-3-3S7 1.34 7 3v2c0 1.66 1.34 3 3 3zm5-5V3c0-1.66 1.34-3 3-3s3 1.34 3 3v2c0 1.66-1.34 3-3 3s-3-1.34-3-3zm-5 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5zm9-5c0 1.66-1.34 3-3 3s-3-1.34-3-3H15zm-14 0h2c0 1.66 1.34 3 3 3s3-1.34 3-3H1z"/></svg>
                    Speak
                </span>
            </button>
            <button id="typeModeBtn" onclick="setInputMode('type')" class="flex-1 py-3 text-lg font-medium border-b-2 transition duration-150 focus:outline-none">
                <span class="inline-flex items-center">
                    <!-- Pencil Icon for Type -->
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zm-1.88 2.518L4.3 14.118V16h1.88l8.988-8.988-1.88-1.88z" /></svg>
                    Type
                </span>
            </button>
        </div>

        <!-- Input Containers -->
        <div id="speakInputContainer" class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Your Spoken Phrase:</label>
            <div class="flex items-center space-x-3">
                <div id="recognizedTextDisplay" class="min-h-[70px] flex-grow p-3 border border-gray-300 rounded-lg bg-gray-50 flex items-center text-gray-500 italic">
                    Click the **Start Recording** button below to begin speaking.
                </div>
                <!-- Playback button for STT Result (Visible only after recording) -->
                <button id="sttPlayButton" onclick="playOriginalAudio()" class="p-3 rounded-full bg-gray-300 text-gray-700 hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 disabled:opacity-50 shadow-sm hidden" disabled>
                    <!-- Speaker Icon -->
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M18 5v10l-4-4H4V9h10l4-4z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <p id="sttStatus" class="text-sm mt-1 text-gray-500"></p>
            <p id="ttsClarification" class="text-xs text-blue-600 mt-2 italic hidden"></p>
        </div>

        <div id="typeInputContainer" class="mb-6 hidden">
            <label for="typedInput" class="block text-sm font-medium text-gray-700 mb-2">Type your phrase here:</label>
            <textarea id="typedInput" rows="3" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-primary focus:border-primary"></textarea>
            <p class="text-sm mt-1 text-gray-500">Press **Correct & Speak** to get feedback.</p>
        </div>


        <!-- Action Button (Now controls Recording and Correction) -->
        <div class="mb-8">
            <button id="mainActionButton" class="w-full flex items-center justify-center px-6 py-4 border border-transparent text-lg font-medium rounded-lg text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150 shadow-md disabled:opacity-50">
                <!-- Mic Icon (Default) -->
                <svg id="micIcon" class="w-6 h-6 mr-3" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 8c1.66 0 3-1.34 3-3V3c0-1.66-1.34-3-3-3S7 1.34 7 3v2c0 1.66 1.34 3 3 3zm5-5V3c0-1.66 1.34-3 3-3s3 1.34 3 3v2c0 1.66-1.34 3-3 3s-3-1.34-3-3zm-5 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5zm9-5c0 1.66-1.34 3-3 3s-3-1.34-3-3H15zm-14 0h2c0 1.66 1.34 3 3 3s3-1.34 3-3H1z"/></svg>
                <!-- Pencil Icon (Correction) -->
                <svg id="correctionIcon" class="w-6 h-6 mr-3 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zm-1.88 2.518L4.3 14.118V16h1.88l8.988-8.988-1.88-1.88z" /></svg>
                <span id="buttonText">Start Recording</span>
                <div id="loadingSpinner" class="spinner ml-3 hidden"></div>
            </button>
            <p id="errorFeedback" class="text-red-600 mt-2 text-base font-semibold hidden border-2 border-red-300 p-2 rounded-lg bg-red-100"></p>
        </div>

        <!-- Results Display Section -->
        <div id="resultsContainer" class="space-y-6 hidden">
            
            <!-- Original Phrase -->
            <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-300">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase text-gray-500">Your Phrase</p>
                </div>
                <!-- The LLM-verified phrase is displayed here after correction -->
                <p id="originalPhraseDisplay" class="text-gray-900 mt-1 italic"></p>
            </div>

            <!-- Native Correction -->
            <div class="bg-green-50 p-4 rounded-lg border-l-4 border-secondary">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase text-secondary">Native Correction (AI)</p>
                    <button id="playButton" onclick="playCorrectedAudio()" class="p-3 rounded-full bg-secondary text-white hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-secondary disabled:opacity-50 shadow-lg" disabled>
                        <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
                <p id="correctedPhraseDisplay" class="text-gray-900 mt-1 font-medium"></p>
            </div>

            <!-- Explanation -->
            <div id="explanationBox" class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                <p class="text-xs font-semibold uppercase text-blue-600 mb-1">Why it sounds better</p>
                <p id="explanationDisplay" class="text-gray-700 text-sm"></p>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="ttsAudio" class="hidden"></audio>

    <script>
        // --- API & Utility Setup ---
        // CRITICAL: When deploying this code outside of the Canvas environment, 
        // you MUST replace "" with your actual API key, or use a secure proxy.
        const API_KEY = "AIzaSyBdsNLqnHsjZmL3nGQEjOmgmCeKPpFRBys"; 
        
        const USE_MOCK_DATA = false; 

        // Models and Endpoints (used only if USE_MOCK_DATA is false)
        const LLM_MODEL = 'gemini-2.5-flash-preview-09-2025';
        const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
        const LLM_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${API_KEY}`;
        const TTS_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${API_KEY}`;

        // UI Elements
        const mainActionButton = document.getElementById('mainActionButton');
        const buttonText = document.getElementById('buttonText');
        const micIcon = document.getElementById('micIcon');
        const correctionIcon = document.getElementById('correctionIcon');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorFeedback = document.getElementById('errorFeedback');
        const resultsContainer = document.getElementById('resultsContainer');
        const originalPhraseDisplay = document.getElementById('originalPhraseDisplay');
        const correctedPhraseDisplay = document.getElementById('correctedPhraseDisplay');
        const explanationDisplay = document.getElementById('explanationDisplay');
        const playButton = document.getElementById('playButton');
        const sttPlayButton = document.getElementById('sttPlayButton'); 
        const ttsAudio = document.getElementById('ttsAudio');
        const ttsClarification = document.getElementById('ttsClarification'); 

        // Input Specific Elements
        const speakModeBtn = document.getElementById('speakModeBtn');
        const typeModeBtn = document.getElementById('typeModeBtn');
        const speakInputContainer = document.getElementById('speakInputContainer');
        const typeInputContainer = document.getElementById('typeInputContainer');
        const recognizedTextDisplay = document.getElementById('recognizedTextDisplay');
        const typedInput = document.getElementById('typedInput');
        const sttStatus = document.getElementById('sttStatus');
        
        // Audio State Variables
        let originalAudioBlobUrl = null; // Stores MIC recording (Speak mode) or TTS (Type mode)
        let correctedAudioBlobUrl = null; // Stores TTS for corrected phrase
        let currentPhrase = ''; // Stores the raw STT or Typed text

        // Microphone Recording State
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;

        // Application State
        let inputMode = 'speak'; // Set default mode to 'speak' for immediate testing
        let appState = 'idle';

        // --- Microphone Recording Functions ---
        async function startRecording() {
            if (appState !== 'idle') return;
            setAppState('requesting_mic'); // New state to handle permission prompt
            
            try {
                // 1. Get audio stream and set up MediaRecorder
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm; codecs=opus' });
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm; codecs=opus' });
                    // Revoke old URL if exists before creating new one
                    if (originalAudioBlobUrl) URL.revokeObjectURL(originalAudioBlobUrl); 
                    originalAudioBlobUrl = URL.createObjectURL(audioBlob);
                    
                    audioStream.getTracks().forEach(track => track.stop()); // Stop mic
                    audioStream = null;
                    
                    // Transition state only if transcription is also done
                    if (currentPhrase.length > 0) {
                        setAppState('ready_to_correct');
                        sttStatus.textContent = "Phrase captured. Click 'Correct & Speak' to continue.";
                    } else {
                        sttStatus.textContent = "Audio captured. Waiting for transcription...";
                    }
                };
                
                // 2. Start recording and STT
                mediaRecorder.start();
                recognition.start();
                setAppState('recording');
                sttStatus.textContent = "Listening and recording your voice...";

            } catch (err) {
                console.error('Microphone access denied or error:', err);
                if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                    errorFeedback.textContent = "Microphone access was denied. Please check your browser's site settings for this page and refresh to try again.";
                } else {
                    errorFeedback.textContent = "An error occurred while accessing the microphone: " + err.message;
                }
                errorFeedback.classList.remove('hidden');
                setAppState('idle'); // Crucial: Revert to idle state to re-enable the button
                // Cleanup potentially half-started objects
                if (audioStream) audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (recognition && recognition.listening) {
                recognition.stop();
            }
            setAppState('processing_audio'); 
            sttStatus.textContent = "Stopping recording. Processing transcription and audio...";
        }


        // --- Speech Recognition Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                // UI changes handled by startRecording() now
                recognizedTextDisplay.textContent = '...';
                recognizedTextDisplay.classList.add('animate-pulse-mic');
                sttPlayButton.classList.add('hidden'); 
                sttStatus.textContent = "Listening...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                currentPhrase = transcript;
                recognizedTextDisplay.textContent = transcript;
                recognizedTextDisplay.classList.remove('italic', 'text-gray-500');
                recognizedTextDisplay.classList.add('text-gray-800', 'font-medium');
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                sttStatus.textContent = `Error: ${event.error}`;
                // Only show critical error if we were recording/processing
                if (appState !== 'idle') {
                    errorFeedback.textContent = "Transcription failed. Click the mic to try again.";
                    errorFeedback.classList.remove('hidden');
                    setAppState('idle'); 
                }
            };

            recognition.onend = async () => {
                recognizedTextDisplay.classList.remove('animate-pulse-mic');
                
                if (currentPhrase.length > 0) {
                    // STT is done. If mediaRecorder is also done, set to ready_to_correct.
                    if (!mediaRecorder || mediaRecorder.state === 'inactive' || appState === 'ready_to_correct') {
                         setAppState('ready_to_correct');
                         sttStatus.textContent = "Phrase captured. Click 'Correct & Speak'.";
                    } else {
                        // Mic recorder is still finalizing, update status and wait for onstop
                        sttStatus.textContent = "Transcription complete. Waiting for microphone audio to finalize...";
                    }
                } else {
                    // No speech detected
                    sttStatus.textContent = "No speech detected. Click the mic to try again.";
                    recognizedTextDisplay.textContent = 'Click the **Start Recording** button below to begin speaking.';
                    recognizedTextDisplay.classList.remove('text-gray-800', 'font-medium');
                    recognizedTextDisplay.classList.add('italic', 'text-gray-500');
                    
                    // Force stop recorder if it's still running, as we have no usable text
                    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                        mediaRecorder.stop(); 
                    } else {
                        setAppState('idle'); 
                    }
                }
            };
        } else {
            if (speakModeBtn) speakModeBtn.style.display = 'none';
            if (typeModeBtn) typeModeBtn.style.flex = 'none'; 
            errorFeedback.textContent = "Speech Recognition is not fully supported in this browser. Please use the Type mode.";
            errorFeedback.classList.remove('hidden');
        }
        
        // --- Input Mode Management ---
        function setInputMode(mode) {
            if (appState === 'recording' || appState === 'processing' || appState === 'processing_audio' || appState === 'requesting_mic') return;

            inputMode = mode;
            cleanupAudioResources(true); 

            // 1. Manage UI containers
            speakInputContainer.classList.toggle('hidden', mode !== 'speak');
            typeInputContainer.classList.toggle('hidden', mode !== 'type');
            sttPlayButton.classList.add('hidden'); 
            ttsClarification.classList.add('hidden'); 

            // 2. Manage Toggle buttons style
            speakModeBtn.classList.remove('text-primary', 'border-primary', 'text-gray-500', 'border-transparent');
            typeModeBtn.classList.remove('text-primary', 'border-primary', 'text-gray-500', 'border-transparent');
            
            if (mode === 'speak') {
                speakModeBtn.classList.add('text-primary', 'border-primary');
                typeModeBtn.classList.add('text-gray-500', 'border-transparent');
            } else {
                typeModeBtn.classList.add('text-primary', 'border-primary');
                speakModeBtn.classList.add('text-gray-500', 'border-transparent');
            }
            
            // 3. Reset to idle state 
            setAppState('idle');
        }


        // --- State Machine ---
        function setAppState(newState) {
            appState = newState;
            // Clean up visual status indicators and reset button styles
            errorFeedback.classList.add('hidden');
            mainActionButton.disabled = false;
            micIcon.classList.add('hidden');
            correctionIcon.classList.add('hidden');
            loadingSpinner.classList.add('hidden');
            mainActionButton.classList.remove('bg-red-500', 'hover:bg-red-600', 'bg-secondary', 'hover:bg-teal-600');
            mainActionButton.classList.add('bg-primary', 'hover:bg-indigo-700');
            
            if (inputMode === 'speak') {
                sttStatus.textContent = '';
            } 

            switch (appState) {
                case 'idle':
                    buttonText.textContent = inputMode === 'speak' ? 'Start Recording' : 'Correct & Speak';
                    if (inputMode === 'speak') {
                        micIcon.classList.remove('hidden');
                        sttPlayButton.disabled = true; 
                        sttPlayButton.classList.add('hidden');
                    } else {
                        correctionIcon.classList.remove('hidden');
                        mainActionButton.classList.remove('bg-primary', 'hover:bg-indigo-700');
                        mainActionButton.classList.add('bg-secondary', 'hover:bg-teal-600');
                    }
                    break;
                case 'requesting_mic':
                    buttonText.textContent = 'Awaiting Permission...';
                    loadingSpinner.classList.remove('hidden');
                    mainActionButton.disabled = true;
                    micIcon.classList.remove('hidden');
                    break;
                case 'recording':
                    buttonText.textContent = 'Listening... (Click to Stop)';
                    mainActionButton.classList.remove('bg-primary', 'hover:bg-indigo-700');
                    mainActionButton.classList.add('bg-red-500', 'hover:bg-red-600');
                    micIcon.classList.remove('hidden');
                    break;
                case 'ready_to_correct':
                    buttonText.textContent = 'Correct & Speak';
                    correctionIcon.classList.remove('hidden');
                    mainActionButton.classList.remove('bg-primary', 'hover:bg-indigo-700');
                    mainActionButton.classList.add('bg-secondary', 'hover:bg-teal-600');
                    sttPlayButton.disabled = false; 
                    sttPlayButton.classList.remove('hidden'); 
                    break;
                case 'processing':
                case 'processing_audio':
                    buttonText.textContent = appState === 'processing_audio' ? 'Processing Audio...' : 'Processing Correction...';
                    loadingSpinner.classList.remove('hidden');
                    mainActionButton.disabled = true;
                    mainActionButton.classList.remove('bg-secondary', 'hover:bg-teal-600', 'bg-primary', 'hover:bg-indigo-700');
                    mainActionButton.classList.add('bg-primary', 'hover:bg-indigo-700'); 
                    sttPlayButton.disabled = true; 
                    break;
            }
        }

        // --- Button Click Handler ---
        mainActionButton.addEventListener('click', () => {
            cleanupAudioResources(false, true); 
            
            if (inputMode === 'speak') {
                if (!recognition) {
                    errorFeedback.textContent = "Speech Recognition not available.";
                    errorFeedback.classList.remove('hidden');
                    return;
                }
                if (appState === 'idle') {
                    currentPhrase = '';
                    startRecording(); 
                } else if (appState === 'recording') {
                    stopRecording(); 
                } else if (appState === 'ready_to_correct') {
                    correctAndSynthesize(currentPhrase, true); 
                }
            } else { // inputMode === 'type'
                const text = typedInput.value.trim();
                if (text.length > 0) {
                    currentPhrase = text; 
                    correctAndSynthesize(text, false); 
                } else {
                    errorFeedback.textContent = "Please type a phrase before clicking 'Correct & Speak'.";
                    errorFeedback.classList.remove('hidden');
                }
            }
        });


        // --- Audio Cleanup Function ---
        function cleanupAudioResources(resetInput = true, keepOriginalAudio = false) {
            // Revoke corrected URL
            if (correctedAudioBlobUrl) {
                URL.revokeObjectURL(correctedAudioBlobUrl);
                correctedAudioBlobUrl = null;
            }

            // Revoke original URL unless specifically told to keep it (for STT->Correct flow)
            if (!keepOriginalAudio && originalAudioBlobUrl) {
                URL.revokeObjectURL(originalAudioBlobUrl);
                originalAudioBlobUrl = null;
            }
            
            ttsAudio.src = ''; 
            
            // Disable buttons
            playButton.disabled = true; 
            sttPlayButton.disabled = true; 
            sttPlayButton.classList.add('hidden');
            ttsClarification.classList.add('hidden'); 

            resultsContainer.classList.add('hidden');
            errorFeedback.classList.add('hidden');
            
            if (resetInput) {
                recognizedTextDisplay.textContent = 'Click the **Start Recording** button below to begin speaking.';
                recognizedTextDisplay.classList.remove('text-gray-800', 'font-medium');
                recognizedTextDisplay.classList.add('italic', 'text-gray-500');
                currentPhrase = '';
            }
        }

        // --- Exponential Backoff Fetch Wrapper ---
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    }
                    const errorDetails = await response.text();
                    console.error(`Attempt ${i + 1} failed. Status: ${response.status}. URL: ${url}. Details:`, errorDetails);
                    
                    if (response.status === 403) {
                         const service = url.includes(LLM_MODEL) ? 'Language Model (LLM)' : 'Text-to-Speech (TTS)';
                         throw new Error(`Authorization Failed (403 Forbidden). Ensure the API key is valid.`);
                    }
                    if ((response.status === 429 || response.status >= 500) && i < maxRetries - 1) {
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }
                    throw new Error(`API Request Failed: ${response.status} ${response.statusText}`);
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error;
                    }
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Exceeded maximum retries.");
        }

        // --- Audio Utility Functions ---
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2; // 16-bit PCM
            const dataLength = pcm16.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF'); 
            view.setUint32(4, 36 + dataLength, true); 
            writeString(view, 8, 'WAVE'); 

            // FMT sub-chunk
            writeString(view, 12, 'fmt '); 
            view.setUint32(16, 16, true); 
            view.setUint16(20, 1, true); 
            view.setUint16(22, numChannels, true); 
            view.setUint32(24, sampleRate, true); 
            view.setUint32(28, sampleRate * numChannels * bytesPerSample, true); 
            view.setUint32(32, numChannels * bytesPerSample, true); 
            view.setUint16(34, 16, true); 

            // Data sub-chunk
            writeString(view, 36, 'data'); 
            view.setUint32(40, dataLength, true); 

            // Write the PCM data
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
        
        // --- Playback Functions ---
        // Function to disable both play buttons while audio is active
        function setPlaybackState(isPlaying) {
            playButton.disabled = isPlaying;
            sttPlayButton.disabled = isPlaying;
            if (!isPlaying) {
                // Re-enable based on audio source availability
                if (correctedAudioBlobUrl) playButton.disabled = false;
                if (originalAudioBlobUrl && appState === 'ready_to_correct') sttPlayButton.disabled = false;
            }
        }

        function playAudioSource(audioUrl) {
            if (!audioUrl) return;

            ttsAudio.src = audioUrl;
            ttsAudio.play();
            setPlaybackState(true);

            ttsAudio.onended = () => { setPlaybackState(false); };
            ttsAudio.onerror = () => {
                console.error("Audio playback error.");
                errorFeedback.textContent = "Could not play audio. Try generating the audio again.";
                errorFeedback.classList.remove('hidden');
                setPlaybackState(false);
            };
        }

        function playOriginalAudio() {
            playAudioSource(originalAudioBlobUrl);
        }

        function playCorrectedAudio() {
            playAudioSource(correctedAudioBlobUrl);
        }

        // --- TTS Utility Function ---
        async function getTtsAudioBlobUrl(text) {
            const ttsPayload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: { prebuiltVoiceConfig: { voiceName: "Zephyr" } } 
                    }
                },
            };

            const ttsResponse = await fetchWithRetry(TTS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ttsPayload)
            });

            const ttsResult = await ttsResponse.json();
            const audioPart = ttsResult?.candidates?.[0]?.content?.parts?.[0];
            const audioData = audioPart?.inlineData?.data;
            const mimeType = audioPart?.inlineData?.mimeType;

            if (!audioData || !mimeType || !mimeType.startsWith("audio/L16")) {
                throw new Error("Failed to receive valid audio data from the Text-to-Speech Model.");
            }

            const rateMatch = mimeType.match(/rate=(\d+)/);
            const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000; 

            const pcmBuffer = base64ToArrayBuffer(audioData);
            const pcm16 = new Int16Array(pcmBuffer);
            const wavBlob = pcmToWav(pcm16, sampleRate);
            
            return URL.createObjectURL(wavBlob);
        }


        // --- Main Application Logic ---

        async function correctAndSynthesize(userText, originalAudioPreloaded = false) {
            if (!userText || appState === 'processing') {
                return;
            }
            
            setAppState('processing');
            
            let correctedText;
            let originalText;

            try {
                // 1. LLM Call: Get Native Correction and Explanation (structured JSON)
                const llmPayload = {
                    contents: [{ 
                        parts: [{ 
                            text: `User Phrase: "${userText}"`
                        }]
                    }],
                    systemInstruction: {
                        parts: [{ text: "You are a friendly, expert English conversation tutor specializing in making phrases sound natural, idiomatic, and native. Analyze the 'User Phrase', rewrite it to be completely natural and idiomatic in English, and provide a simple explanation for the change. If the user phrase is already natural, your native correction should be identical to the original phrase, and your explanation should state that the phrase is already idiomatic and perfectly correct." }]
                    },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "originalPhrase": { "type": "STRING" },
                                "nativeCorrection": { "type": "STRING" },
                                "explanation": { "type": "STRING" }
                            },
                            required: ["originalPhrase", "nativeCorrection", "explanation"]
                        }
                    },
                };
                
                const llmResponse = await fetchWithRetry(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(llmPayload)
                });
                
                const llmResult = await llmResponse.json();
                
                const jsonText = llmResult.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) {
                    throw new Error("Failed to get a structured correction from the Language Model. Response was empty or malformed.");
                }
                
                let parsedJson;
                try {
                    parsedJson = JSON.parse(jsonText);
                } catch (e) {
                     // Sometimes the model wraps the JSON in a markdown block, try to fix it.
                    const cleanedJsonText = jsonText.replace(/```json\n|```/g, '').trim();
                    parsedJson = JSON.parse(cleanedJsonText);
                }
                
                correctedText = parsedJson.nativeCorrection;
                originalText = parsedJson.originalPhrase;

                // Update UI with LLM results
                originalPhraseDisplay.textContent = originalText;
                correctedPhraseDisplay.textContent = correctedText;
                explanationDisplay.textContent = parsedJson.explanation;
                resultsContainer.classList.remove('hidden');

                // 2. TTS Call: Synthesize the CORRECTED Phrase
                correctedAudioBlobUrl = await getTtsAudioBlobUrl(correctedText);
                
                // 3. TTS Call: Synthesize the ORIGINAL Phrase (ONLY if not preloaded - i.e., in Type mode)
                if (!originalAudioPreloaded) {
                    originalAudioBlobUrl = await getTtsAudioBlobUrl(originalText);
                    sttPlayButton.classList.remove('hidden'); 
                }

                // Autoplay the corrected phrase and enable the corrected button
                playCorrectedAudio(); 

            } catch (error) {
                console.error("An error occurred during API process:", error);
                errorFeedback.textContent = `CRITICAL ERROR: ${error.message}`;
                errorFeedback.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } finally {
                // After processing, if we were in Speak mode, we go back to ready_to_correct state, 
                // allowing the user to try a new correction or speak again.
                // Otherwise, go back to idle.
                setAppState(inputMode === 'speak' ? 'ready_to_correct' : 'idle');
            }
        }

        // Initialize mode and state on load
        window.onload = () => {
             // Set an initial common non-native error for easy first test
             typedInput.value = "I am highly interested on the subject and want to learn more.";
             // Start in Speak mode for immediate use
             setInputMode('speak'); 
        };
    </script>
</body>
