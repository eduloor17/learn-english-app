<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native English Coach</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4F46E5',
                        'secondary': '#10B981',
                        'dark-bg': '#1F2937',
                        'light-text': '#F3F4F6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* Custom spinner for loading state */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Style for active recording */
        .recording-active {
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-xl bg-white p-6 md:p-8 rounded-xl card">
        <h1 class="text-3xl font-bold text-center text-primary mb-2">Native English Coach</h1>
        <p class="text-center text-gray-500 mb-6">Type a phrase. I'll make it sound native, and let you hear it!</p>

        <!-- User Input Section -->
        <div class="mb-6">
            <label for="englishInput" class="block text-sm font-medium text-gray-700 mb-2">Your English Phrase:</label>
            <textarea id="englishInput" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150" placeholder="e.g., I desire to have more knowledge."></textarea>
        </div>

        <!-- Recording Controls (New Feature) -->
        <div class="mb-6 border-t pt-4">
            <p class="text-sm font-semibold text-gray-700 mb-2">1. Practice & Compare (Optional):</p>
            <div class="flex space-x-2">
                <button id="recordButton" onclick="startRecording()" class="flex-1 flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-red-500 hover:bg-red-600 transition disabled:opacity-50">
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
                    Record
                </button>
                <button id="stopButton" onclick="stopRecording()" class="flex-1 flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-gray-500 hover:bg-gray-600 transition disabled:opacity-50" disabled>
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M5 4a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1V5a1 1 0 00-1-1H5z"/></svg>
                    Stop
                </button>
                <button id="playUserButton" onclick="playUserAudio()" class="flex-1 flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-secondary hover:bg-teal-600 transition disabled:opacity-50" disabled>
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                    </svg>
                    Play Yours
                </button>
            </div>
            <p id="recordStatus" class="mt-2 text-xs text-red-500 font-medium hidden">🔴 Recording in progress... Click Stop when finished.</p>
            <p id="userAudioFeedback" class="mt-2 text-xs text-gray-500 hidden"></p>
        </div>


        <!-- Action Button -->
        <div class="mb-8">
            <p class="text-sm font-semibold text-gray-700 mb-2">2. Get AI Correction & Native Audio:</p>
            <!-- Removed inline onclick and added an ID for the listener in JS -->
            <button id="submitButton" class="w-full flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150 shadow-md disabled:opacity-50" disabled>
                <span id="buttonText">Correct & Speak</span>
                <div id="loadingSpinner" class="spinner ml-3 hidden"></div>
            </button>
            <p id="errorFeedback" class="text-red-500 mt-2 text-sm hidden"></p>
        </div>

        <!-- Results Display Section -->
        <div id="resultsContainer" class="space-y-6 hidden">
            
            <!-- Original Phrase -->
            <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-300">
                <p class="text-xs font-semibold uppercase text-gray-500">Your Original Phrase</p>
                <p id="originalPhraseDisplay" class="text-gray-900 mt-1 italic"></p>
            </div>

            <!-- Native Correction -->
            <div class="bg-green-50 p-4 rounded-lg border-l-4 border-secondary">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase text-secondary">Native Correction (AI)</p>
                    <button id="playButton" onclick="playAudio()" class="p-2 rounded-full bg-secondary text-white hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-secondary disabled:opacity-50 shadow-lg" disabled>
                        <svg id="playIcon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
                <p id="correctedPhraseDisplay" class="text-gray-900 mt-1 font-medium"></p>
            </div>

            <!-- Explanation -->
            <div id="explanationBox" class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                <p class="text-xs font-semibold uppercase text-blue-600 mb-1">Why it sounds better</p>
                <p id="explanationDisplay" class="text-gray-700 text-sm"></p>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="ttsAudio" class="hidden"></audio>
    <audio id="userAudio" class="hidden"></audio>

    <script>
        // --- API & Utility Setup ---
        const API_KEY = ""; // Kept empty, provided by the runtime environment
        
        // Models and Endpoints
        const LLM_MODEL = 'gemini-2.5-flash-preview-09-2025';
        const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
        const LLM_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${API_KEY}`;
        const TTS_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${API_KEY}`;

        // UI Elements
        const englishInput = document.getElementById('englishInput');
        const submitButton = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorFeedback = document.getElementById('errorFeedback');
        const resultsContainer = document.getElementById('resultsContainer');
        const originalPhraseDisplay = document.getElementById('originalPhraseDisplay');
        const correctedPhraseDisplay = document.getElementById('correctedPhraseDisplay');
        const explanationDisplay = document.getElementById('explanationDisplay');
        const playButton = document.getElementById('playButton');
        const ttsAudio = document.getElementById('ttsAudio');
        
        // New UI Elements for Recording
        const recordButton = document.getElementById('recordButton');
        const stopButton = document.getElementById('stopButton');
        const playUserButton = document.getElementById('playUserButton');
        const recordStatus = document.getElementById('recordStatus');
        const userAudioFeedback = document.getElementById('userAudioFeedback');
        const userAudio = document.getElementById('userAudio');

        // Recording State Variables
        let audioBlobUrl = null; // for TTS audio
        let userAudioBlobUrl = null; // for user recorded audio
        let mediaRecorder = null;
        let audioChunks = [];

        // --- Audio Cleanup Function ---
        function cleanupAudioResources() {
            // Revoke temporary URLs to free up browser memory
            if (audioBlobUrl) {
                URL.revokeObjectURL(audioBlobUrl);
                audioBlobUrl = null;
                ttsAudio.src = '';
            }
            if (userAudioBlobUrl) {
                URL.revokeObjectURL(userAudioBlobUrl);
                userAudioBlobUrl = null;
                userAudio.src = '';
            }
            playButton.disabled = true;
            playUserButton.disabled = true;
            resultsContainer.classList.add('hidden');
            userAudioFeedback.classList.add('hidden');
        }

        // --- Event Listeners ---
        // 1. Enable/Disable Submit button based on input
        englishInput.addEventListener('input', () => {
            const isEmpty = englishInput.value.trim().length === 0;
            submitButton.disabled = isEmpty;
            // New: Clean up audio when input is cleared
            if (isEmpty) {
                cleanupAudioResources();
            }
        });

        // 2. Listen for 'Correct & Speak' button click
        submitButton.addEventListener('click', correctAndSynthesize);

        // 3. Listen for 'Enter' key press on the textarea to submit
        englishInput.addEventListener('keypress', (e) => {
            // Check if Enter key (keyCode 13 or key 'Enter') is pressed and Shift key is NOT held (for new line)
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Prevent default new line behavior
                if (!submitButton.disabled) {
                    correctAndSynthesize();
                }
            }
        });
        // --- End Event Listeners ---


        // --- Exponential Backoff Fetch Wrapper ---
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    }
                    if (response.status === 429 && i < maxRetries - 1) {
                        // Rate limit exceeded (429), wait and retry
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        console.warn(`Rate limit hit. Retrying in ${Math.round(delay / 1000)}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }
                    throw new Error(`API Request Failed: ${response.status} ${response.statusText}`);
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error;
                    }
                    // For network errors or other failures, retry with backoff
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    console.warn(`Request failed: ${error.message}. Retrying in ${Math.round(delay / 1000)}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Exceeded maximum retries.");
        }

        // --- Audio Utility Functions ---

        // Converts Base64 string to ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Converts 16-bit PCM audio data to WAV Blob (required for playback)
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2; // 16-bit PCM
            const dataLength = pcm16.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            // Helper function to write a string to the DataView
            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF'); // ChunkID
            view.setUint32(4, 36 + dataLength, true); // ChunkSize
            writeString(view, 8, 'WAVE'); // Format

            // FMT sub-chunk
            writeString(view, 12, 'fmt '); // Subchunk1ID
            view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
            view.setUint16(20, 1, true); // AudioFormat (1 for PCM)
            view.setUint16(22, numChannels, true); // NumChannels
            view.setUint32(24, sampleRate, true); // SampleRate
            view.setUint32(28, sampleRate * numChannels * bytesPerSample, true); // ByteRate
            view.setUint16(32, numChannels * bytesPerSample, true); // BlockAlign
            view.setUint16(34, 16, true); // BitsPerSample (16-bit)

            // Data sub-chunk
            writeString(view, 36, 'data'); // Subchunk2ID
            view.setUint32(40, dataLength, true); // Subchunk2Size

            // Write the PCM data
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
        
        // Plays the TTS audio (onclick retained here for simplicity)
        function playAudio() {
            if (ttsAudio.src) {
                ttsAudio.play();
                playButton.disabled = true;
                ttsAudio.onended = () => {
                    playButton.disabled = false;
                };
                ttsAudio.onerror = () => {
                    console.error("TTS audio playback error.");
                    playButton.disabled = false;
                    errorFeedback.textContent = "Could not play native audio.";
                    errorFeedback.classList.remove('hidden');
                };
            }
        }

        // Plays the user's recorded audio (onclick retained here for simplicity)
        function playUserAudio() {
            if (userAudio.src) {
                userAudio.play();
                playUserButton.disabled = true;
                userAudio.onended = () => {
                    playUserButton.disabled = false;
                };
                userAudio.onerror = () => {
                    console.error("User audio playback error.");
                    playUserButton.disabled = false;
                    userAudioFeedback.textContent = "Error playing your recording.";
                    userAudioFeedback.classList.remove('hidden');
                };
            }
        }

        // --- Recording Logic (onclick retained here for simplicity) ---
        async function startRecording() {
            try {
                // Clear previous recording URL
                if (userAudioBlobUrl) { URL.revokeObjectURL(userAudioBlobUrl); }
                userAudio.src = '';
                playUserButton.disabled = true;
                userAudioFeedback.classList.add('hidden');
                
                // Request microphone access
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    // Create Blob from chunks
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    userAudioBlobUrl = URL.createObjectURL(audioBlob);
                    userAudio.src = userAudioBlobUrl;
                    
                    // Cleanup stream
                    stream.getTracks().forEach(track => track.stop());

                    // Update UI state
                    recordButton.disabled = false;
                    stopButton.disabled = true;
                    playUserButton.disabled = false;
                    recordStatus.classList.add('hidden');
                    userAudioFeedback.textContent = "✅ Recording saved! Play it back to compare with the native audio (after clicking 'Correct & Speak').";
                    userAudioFeedback.classList.remove('hidden');
                };

                mediaRecorder.start();
                
                // Update UI state
                recordButton.disabled = true;
                stopButton.disabled = false;
                recordButton.classList.add('recording-active');
                recordStatus.classList.remove('hidden');
                userAudioFeedback.classList.add('hidden');
                
            } catch (err) {
                console.error("Microphone access error:", err);
                errorFeedback.textContent = "Error accessing microphone. Please ensure permissions are granted.";
                errorFeedback.classList.remove('hidden');
                // Reset button state
                recordButton.disabled = false;
                stopButton.disabled = true;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                recordButton.classList.remove('recording-active');
            }
        }


        // --- Main Application Logic ---

        async function correctAndSynthesize() {
            const userText = englishInput.value.trim();
            if (!userText) {
                return;
            }

            // Clear previous results and set loading state
            resultsContainer.classList.add('hidden');
            errorFeedback.classList.add('hidden');
            submitButton.disabled = true;
            buttonText.textContent = 'Processing...';
            loadingSpinner.classList.remove('hidden');
            
            // Clean up the previous TTS audio before starting a new request
            if (audioBlobUrl) { URL.revokeObjectURL(audioBlobUrl); }
            playButton.disabled = true;

            let correctedText;

            try {
                // 1. LLM Call: Get Native Correction and Explanation (structured JSON)
                const llmPayload = {
                    contents: [{ 
                        parts: [{ 
                            text: `The user wants you to act as an English tutor. Take the following non-native phrase and rewrite it to sound completely natural, idiomatic, and native. Also provide a simple explanation for the change. Return only a JSON object.` 
                        },
                        {
                            text: `User Phrase: "${userText}"`
                        }]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "originalPhrase": { "type": "STRING" },
                                "nativeCorrection": { "type": "STRING" },
                                "explanation": { "type": "STRING" }
                            },
                            required: ["originalPhrase", "nativeCorrection", "explanation"]
                        },
                        // System instruction moved to payload for better control over persona
                        systemInstruction: {
                            parts: [{ text: "You are a friendly, expert English conversation tutor specializing in making phrases sound natural, idiomatic, and native. Provide the most natural replacement and a helpful explanation. Respond only with the requested JSON object." }]
                        }
                    },
                };
                
                const llmResponse = await fetchWithRetry(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(llmPayload)
                });
                
                const llmResult = await llmResponse.json();
                
                const jsonText = llmResult.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) {
                    throw new Error("Failed to get structured correction from AI.");
                }
                
                const parsedJson = JSON.parse(jsonText);
                correctedText = parsedJson.nativeCorrection;

                // Update UI with LLM results
                originalPhraseDisplay.textContent = parsedJson.originalPhrase;
                correctedPhraseDisplay.textContent = correctedText;
                explanationDisplay.textContent = parsedJson.explanation;
                resultsContainer.classList.remove('hidden');

                // 2. TTS Call: Synthesize the Native Correction
                const ttsPayload = {
                    contents: [{
                        parts: [{ 
                            text: correctedText
                        }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                // Using 'Zephyr' for a bright, clear native sound
                                prebuiltVoiceConfig: { voiceName: "Zephyr" }
                            }
                        }
                    },
                };

                const ttsResponse = await fetchWithRetry(TTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });

                const ttsResult = await ttsResponse.json();
                const audioPart = ttsResult?.candidates?.[0]?.content?.parts?.[0];
                const audioData = audioPart?.inlineData?.data;
                const mimeType = audioPart?.inlineData?.mimeType;

                if (!audioData || !mimeType || !mimeType.startsWith("audio/L16")) {
                    throw new Error("Failed to receive valid audio data from TTS model.");
                }
                
                // Extract sample rate from mimeType (e.g., audio/L16;rate=24000)
                const rateMatch = mimeType.match(/rate=(\d+)/);
                const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000; 

                // Process the raw PCM audio data
                const pcmBuffer = base64ToArrayBuffer(audioData);
                const pcm16 = new Int16Array(pcmBuffer);
                const wavBlob = pcmToWav(pcm16, sampleRate);
                
                // Create a temporary URL for the audio blob
                audioBlobUrl = URL.createObjectURL(wavBlob);
                ttsAudio.src = audioBlobUrl;
                
                // Enable the play button for the native audio
                playButton.disabled = false;

            } catch (error) {
                console.error("An error occurred during API process:", error);
                errorFeedback.textContent = `Error: ${error.message}. Please try again.`;
                errorFeedback.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } finally {
                // Reset button state
                submitButton.disabled = englishInput.value.trim().length === 0;
                buttonText.textContent = 'Correct & Speak';
                loadingSpinner.classList.add('hidden');
            }
        }

        // Initial check to enable button if text is already present
        if (englishInput.value.trim().length > 0) {
            submitButton.disabled = false;
        }
    </script>
</body>
</html>
