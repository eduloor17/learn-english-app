<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native English Coach</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4F46E5',
                        'secondary': '#10B981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* Custom spinner for loading state */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-xl bg-white p-6 md:p-8 rounded-xl card">
        <h1 class="text-3xl font-bold text-center text-primary mb-2">Native English Coach</h1>
        <p class="text-center text-gray-500 mb-6">Enter a phrase to instantly correct it and hear the native pronunciation.</p>

        <!-- User Input Section -->
        <div class="mb-6">
            <label for="englishInput" class="block text-sm font-medium text-gray-700 mb-2">Your English Phrase:</label>
            <textarea id="englishInput" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary transition duration-150" placeholder="e.g., I desire to have more knowledge."></textarea>
        </div>

        <!-- Action Button -->
        <div class="mb-8">
            <button id="submitButton" class="w-full flex items-center justify-center px-6 py-4 border border-transparent text-lg font-medium rounded-lg text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150 shadow-md disabled:opacity-50" disabled>
                <span id="buttonText">Correct & Speak</span>
                <div id="loadingSpinner" class="spinner ml-3 hidden"></div>
            </button>
            <p id="errorFeedback" class="text-red-600 mt-2 text-base font-semibold hidden border-2 border-red-300 p-2 rounded-lg bg-red-100"></p>
        </div>

        <!-- Results Display Section -->
        <div id="resultsContainer" class="space-y-6 hidden">
            
            <!-- Original Phrase -->
            <div class="bg-gray-50 p-4 rounded-lg border-l-4 border-gray-300">
                <p class="text-xs font-semibold uppercase text-gray-500">Your Original Phrase</p>
                <p id="originalPhraseDisplay" class="text-gray-900 mt-1 italic"></p>
            </div>

            <!-- Native Correction -->
            <div class="bg-green-50 p-4 rounded-lg border-l-4 border-secondary">
                <div class="flex items-center justify-between">
                    <p class="text-xs font-semibold uppercase text-secondary">Native Correction (AI)</p>
                    <button id="playButton" onclick="playAudio()" class="p-3 rounded-full bg-secondary text-white hover:bg-teal-600 focus:outline-none focus:ring-2 focus:ring-secondary disabled:opacity-50 shadow-lg" disabled>
                        <svg id="playIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
                <p id="correctedPhraseDisplay" class="text-gray-900 mt-1 font-medium"></p>
            </div>

            <!-- Explanation -->
            <div id="explanationBox" class="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                <p class="text-xs font-semibold uppercase text-blue-600 mb-1">Why it sounds better</p>
                <p id="explanationDisplay" class="text-gray-700 text-sm"></p>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="ttsAudio" class="hidden"></audio>

    <script>
        // --- API & Utility Setup ---
        const API_KEY = ""; // Intentionally empty, expected to be injected by runtime environment.
        
        // **DEBUG FLAG: SET TO TRUE TO BYPASS API CALLS AND TEST UI FUNCTIONALITY**
        const USE_MOCK_DATA = false; 

        // Models and Endpoints
        const LLM_MODEL = 'gemini-2.5-flash-preview-09-2025';
        const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
        const LLM_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${API_KEY}`;
        const TTS_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${API_KEY}`;

        // UI Elements
        const englishInput = document.getElementById('englishInput');
        const submitButton = document.getElementById('submitButton');
        const buttonText = document.getElementById('buttonText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorFeedback = document.getElementById('errorFeedback');
        const resultsContainer = document.getElementById('resultsContainer');
        const originalPhraseDisplay = document.getElementById('originalPhraseDisplay');
        const correctedPhraseDisplay = document.getElementById('correctedPhraseDisplay');
        const explanationDisplay = document.getElementById('explanationDisplay');
        const playButton = document.getElementById('playButton');
        const ttsAudio = document.getElementById('ttsAudio');
        
        let audioBlobUrl = null; // for TTS audio

        // --- Audio Cleanup Function ---
        function cleanupAudioResources() {
            if (audioBlobUrl) {
                URL.revokeObjectURL(audioBlobUrl);
                audioBlobUrl = null;
                ttsAudio.src = '';
            }
            playButton.disabled = true;
            resultsContainer.classList.add('hidden');
            errorFeedback.classList.add('hidden');
        }

        // --- Event Listeners ---
        englishInput.addEventListener('input', () => {
            const isEmpty = englishInput.value.trim().length === 0;
            submitButton.disabled = isEmpty;
            if (isEmpty) {
                cleanupAudioResources();
            }
        });

        submitButton.addEventListener('click', correctAndSynthesize);

        englishInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                if (!submitButton.disabled) {
                    correctAndSynthesize();
                }
            }
        });
        // --- End Event Listeners ---


        // --- Exponential Backoff Fetch Wrapper ---
        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    }
                    // Capture detailed error information for debugging
                    const errorDetails = await response.text();
                    console.error(`Attempt ${i + 1} failed. Status: ${response.status}. URL: ${url}. Details:`, errorDetails);
                    
                    if (response.status === 403) {
                         // Critical Auth Error
                         const service = url.includes(LLM_MODEL) ? 'Language Model (LLM)' : 'Text-to-Speech (TTS)';
                        throw new Error(`Authorization Failed (403 Forbidden). The request to the ${service} API was denied. This is an environment configuration issue, meaning the provided API Key is invalid or missing required permissions.`);
                    }
                    if (response.status === 429 && i < maxRetries - 1) {
                        // Rate limit exceeded (429), wait and retry
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }
                    throw new Error(`API Request Failed: ${response.status} ${response.statusText}`);
                } catch (error) {
                    if (i === maxRetries - 1) {
                        throw error;
                    }
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Exceeded maximum retries.");
        }

        // --- Audio Utility Functions ---

        // Converts Base64 string to ArrayBuffer
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Converts 16-bit PCM audio data to WAV Blob (required for playback)
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bytesPerSample = 2; // 16-bit PCM
            const dataLength = pcm16.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            // RIFF chunk descriptor
            writeString(view, 0, 'RIFF'); 
            view.setUint32(4, 36 + dataLength, true); 
            writeString(view, 8, 'WAVE'); 

            // FMT sub-chunk
            writeString(view, 12, 'fmt '); 
            view.setUint32(16, 16, true); 
            view.setUint16(20, 1, true); 
            view.setUint16(22, numChannels, true); 
            view.setUint32(24, sampleRate, true); 
            view.setUint32(28, sampleRate * numChannels * bytesPerSample, true); 
            view.setUint16(32, numChannels * bytesPerSample, true); 
            view.setUint16(34, 16, true); 

            // Data sub-chunk
            writeString(view, 36, 'data'); 
            view.setUint32(40, dataLength, true); 

            // Write the PCM data
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }
        
        // Plays the TTS audio
        function playAudio() {
            if (ttsAudio.src) {
                ttsAudio.play();
                playButton.disabled = true;
                ttsAudio.onended = () => { playButton.disabled = false; };
                ttsAudio.onerror = () => {
                    console.error("TTS audio playback error.");
                    playButton.disabled = false;
                    errorFeedback.textContent = "Could not play native audio.";
                    errorFeedback.classList.remove('hidden');
                };
            }
        }


        // --- Main Application Logic ---

        async function correctAndSynthesize() {
            const userText = englishInput.value.trim();
            if (!userText) {
                return;
            }

            // Clear previous results and set loading state
            cleanupAudioResources();
            submitButton.disabled = true;
            buttonText.textContent = 'Processing...';
            loadingSpinner.classList.remove('hidden');
            
            let correctedText;

            try {
                if (USE_MOCK_DATA) {
                    // --- MOCK DATA SIMULATION ---
                    await new Promise(resolve => setTimeout(resolve, 1500)); // Simulate network delay
                    const mockData = {
                        originalPhrase: userText,
                        nativeCorrection: "I'd like to learn more.",
                        explanation: "The phrase 'I desire to have more knowledge' is grammatically correct but very formal. 'I'd like to learn more' is a common, natural, and friendly way to express this desire in everyday English. The TTS audio playback is currently disabled in Mock Mode.",
                    };
                    correctedText = mockData.nativeCorrection;

                    // Update UI with MOCK results
                    originalPhraseDisplay.textContent = mockData.originalPhrase;
                    correctedPhraseDisplay.textContent = correctedText;
                    explanationDisplay.textContent = mockData.explanation;
                    resultsContainer.classList.remove('hidden');
                    playButton.disabled = true; // Cannot mock TTS audio easily

                    errorFeedback.textContent = "✅ SUCCESS: UI logic confirmed! (API Calls bypassed using MOCK data. Set 'USE_MOCK_DATA' back to false to attempt real API call.)";
                    errorFeedback.classList.remove('hidden');
                    return; // Exit the function after mocking
                    // --- END MOCK DATA SIMULATION ---
                }


                // 1. LLM Call: Get Native Correction and Explanation (structured JSON)
                const llmPayload = {
                    contents: [{ 
                        parts: [{ 
                            text: `You are an English tutor. Rewrite the following non-native phrase to sound completely natural, idiomatic, and native. Also provide a simple explanation for the change. Return only a JSON object.` 
                        },
                        {
                            text: `User Phrase: "${userText}"`
                        }]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "originalPhrase": { "type": "STRING" },
                                "nativeCorrection": { "type": "STRING" },
                                "explanation": { "type": "STRING" }
                            },
                            required: ["originalPhrase", "nativeCorrection", "explanation"]
                        },
                        systemInstruction: {
                            parts: [{ text: "You are a friendly, expert English conversation tutor specializing in making phrases sound natural, idiomatic, and native. Provide the most natural replacement and a helpful explanation. Respond only with the requested JSON object." }]
                        }
                    },
                };
                
                const llmResponse = await fetchWithRetry(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(llmPayload)
                });
                
                const llmResult = await llmResponse.json();
                
                const jsonText = llmResult.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) {
                    throw new Error("Failed to get a structured correction from the Language Model.");
                }
                
                const parsedJson = JSON.parse(jsonText);
                correctedText = parsedJson.nativeCorrection;

                // Update UI with LLM results
                originalPhraseDisplay.textContent = parsedJson.originalPhrase;
                correctedPhraseDisplay.textContent = correctedText;
                explanationDisplay.textContent = parsedJson.explanation;
                resultsContainer.classList.remove('hidden');

                // 2. TTS Call: Synthesize the Native Correction
                const ttsPayload = {
                    contents: [{ parts: [{ text: correctedText }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: "Zephyr" } }
                        }
                    },
                };

                const ttsResponse = await fetchWithRetry(TTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });

                const ttsResult = await ttsResponse.json();
                const audioPart = ttsResult?.candidates?.[0]?.content?.parts?.[0];
                const audioData = audioPart?.inlineData?.data;
                const mimeType = audioPart?.inlineData?.mimeType;

                if (!audioData || !mimeType || !mimeType.startsWith("audio/L16")) {
                    throw new Error("Failed to receive valid audio data from the Text-to-Speech Model. This may be an API key/permission issue.");
                }
                
                const rateMatch = mimeType.match(/rate=(\d+)/);
                const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000; 

                // Process the raw PCM audio data
                const pcmBuffer = base64ToArrayBuffer(audioData);
                const pcm16 = new Int16Array(pcmBuffer);
                const wavBlob = pcmToWav(pcm16, sampleRate);
                
                audioBlobUrl = URL.createObjectURL(wavBlob);
                ttsAudio.src = audioBlobUrl;
                
                playButton.disabled = false;

            } catch (error) {
                console.error("An error occurred during API process:", error);
                // Display the specific error message provided by the retry wrapper
                errorFeedback.textContent = `CRITICAL ERROR: ${error.message}`;
                errorFeedback.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } finally {
                // Reset button state
                submitButton.disabled = englishInput.value.trim().length === 0;
                buttonText.textContent = 'Correct & Speak';
                loadingSpinner.classList.add('hidden');
            }
        }

        // Initial check to enable button if text is already present
        if (englishInput.value.trim().length > 0) {
            submitButton.disabled = false;
        }
    </script>
</body>
</html>
