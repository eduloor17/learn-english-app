<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live English Conversation Tutor</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4F46E5', // Indigo
                        'secondary': '#10B981', // Emerald/Teal
                        'user-bubble': '#EEF2FF', // Indigo 50
                        'ai-bubble': '#D1FAE5', // Emerald 100
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        .chat-container {
            height: 70vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-pulse-mic {
            animation: pulse-mic 1.5s infinite;
        }
        @keyframes pulse-mic {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div id="app" class="w-full max-w-lg bg-white p-6 md:p-8 rounded-xl card flex flex-col h-[90vh]">
        <h1 class="text-2xl font-bold text-center text-primary mb-1">Your English Tutor</h1>
        <p class="text-center text-gray-500 mb-4 text-sm">Let's talk about any topic you like!</p>

        <!-- Chat Display Area -->
        <div id="chatContainer" class="chat-container flex-grow p-4 space-y-4 border rounded-lg mb-4 bg-gray-50">
            <!-- Initial AI Message -->
            <div class="flex justify-start">
                <div class="max-w-xs md:max-w-md p-3 rounded-xl rounded-tl-none bg-ai-bubble text-gray-800 shadow-sm">
                    <p class="font-semibold text-secondary mb-1 text-sm">Tutor</p>
                    <p>Hello! I'm here to help you practice your English conversation skills. Feel free to start a discussion about anything—hobbies, news, travel, or just your day. **How can I help you start practicing today?**</p>
                </div>
            </div>
            <!-- Dynamic Messages will be appended here -->
        </div>

        <!-- Input Area -->
        <div id="inputArea" class="mt-auto">
            <textarea id="chatInput" rows="2" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-primary focus:border-primary resize-none mb-2" placeholder="Type your response here or click the microphone..."></textarea>
            
            <div class="flex space-x-2">
                <!-- Microphone Button for STT -->
                <button id="micButton" class="flex-shrink-0 p-3 rounded-lg text-white bg-red-500 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-150 shadow-md w-1/5 disabled:opacity-50 flex items-center justify-center">
                    <svg id="micIcon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 8c1.66 0 3-1.34 3-3V3c0-1.66-1.34-3-3-3S7 1.34 7 3v2c0 1.66 1.34 3 3 3zm5-5V3c0-1.66 1.34-3 3-3s3 1.34 3 3v2c0 1.66-1.34 3-3 3s-3-1.34-3-3zm-5 13c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5zm9-5c0 1.66-1.34 3-3 3s-3-1.34-3-3H15zm-14 0h2c0 1.66 1.34 3 3 3s3-1.34 3-3H1z"/></svg>
                    <div id="micLoading" class="spinner hidden"></div>
                </button>

                <!-- Review/Listen Button -->
                <button id="reviewButton" class="flex-shrink-0 p-3 rounded-lg bg-secondary hover:bg-emerald-600 text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition duration-150 shadow-md w-1/5 disabled:opacity-50 items-center justify-center hidden">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                </button>

                <!-- Send Button -->
                <button id="sendButton" class="flex-grow flex items-center justify-center px-4 py-3 border border-transparent text-lg font-medium rounded-lg text-white bg-primary hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-150 shadow-md disabled:opacity-50" disabled>
                    <span id="sendButtonText">Send Message</span>
                    <div id="sendLoading" class="spinner ml-3 hidden"></div>
                </button>
            </div>
            
            <p id="inputStatus" class="text-sm mt-1 text-gray-500 text-center min-h-5"></p>
            <p id="errorFeedback" class="text-red-600 mt-2 text-sm font-semibold hidden border-2 border-red-300 p-2 rounded-lg bg-red-100"></p>
        </div>
    </div>

    <script>
        // --- API & Utility Setup ---
        const API_KEY = "AIzaSyBdsNLqnHsjZmL3nGQEjOmgmCeKPpFRBys"; 
        const LLM_MODEL = 'gemini-2.5-flash-preview-09-2025';
        const LLM_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${API_KEY}`;
        
        // TTS Model and URL
        const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
        const TTS_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${TTS_MODEL}:generateContent?key=${API_KEY}`;
        const TTS_VOICE = 'Kore'; 

        // UI Elements
        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const micButton = document.getElementById('micButton');
        const reviewButton = document.getElementById('reviewButton'); // New Element
        const sendButton = document.getElementById('sendButton');
        const sendButtonText = document.getElementById('sendButtonText');
        const sendLoading = document.getElementById('sendLoading');
        const micIcon = document.getElementById('micIcon');
        const micLoading = document.getElementById('micLoading');
        const inputStatus = document.getElementById('inputStatus');
        const errorFeedback = document.getElementById('errorFeedback');
        
        // State Variables
        let chatHistory = []; 
        let isProcessing = false;
        let isRecording = false;
        let audioPlayer = null; 

        // Microphone Recording State
        let mediaRecorder = null;
        let audioStream = null;
        let recordedChunks = []; // To store the recorded audio data chunks
        let recordedBlob = null; // Final audio Blob
        let recordedAudioUrl = null; // URL for playback
        let isReviewing = false;
        
        // --- Audio Utility Functions (for PCM to WAV conversion) ---

        /** Converts Base64 string to ArrayBuffer. */
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /** Helper to write strings into DataView (for WAV header). */
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        /** Converts raw signed 16-bit PCM data to a WAV Blob. */
        function pcmToWav(pcm16, sampleRate = 24000) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            
            // RIFF identifier 'RIFF'
            writeString(view, 0, 'RIFF');
            // File size (36 + data size)
            view.setUint32(4, 36 + pcm16.length * 2, true);
            // RIFF type 'WAVE'
            writeString(view, 8, 'WAVE');
            // format chunk identifier 'fmt '
            view.setUint32(12, 0x20746d66, false); // 'fmt '
            // format chunk length (16 for PCM)
            view.setUint32(16, 16, true);
            // sample format (1 for PCM)
            view.setUint16(20, 1, true);
            // number of channels
            view.setUint16(22, 1, true); 
            // sample rate
            view.setUint32(24, sampleRate, true);
            // byte rate (SampleRate * NumChannels * BitsPerSample/8)
            view.setUint32(28, sampleRate * 1 * 2, true); 
            // block align (NumChannels * BitsPerSample/8)
            view.setUint16(32, 1 * 2, true);
            // bits per sample
            view.setUint16(34, 16, true);
            // data chunk identifier 'data'
            view.setUint32(36, 0x61746164, false); // 'data'
            // data chunk length (size of the audio data)
            view.setUint32(40, pcm16.length * 2, true);

            // Write the PCM data
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }
        
        /** Converts Blob to Base64 */
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    // Extract base64 part (after "data:audio/webm;base64,")
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // --- Core Functions ---
        
        /**
         * Adds a message to the UI and updates the chat history.
         */
        function displayMessage(role, text) {
            if (role === 'model') {
                chatHistory.push({ role: 'model', parts: [{ text }] });
            }
            
            const isUser = role === 'user';
            const bubbleClass = isUser ? 'justify-end' : 'justify-start';
            const contentClass = isUser ? 'bg-user-bubble rounded-tr-none' : 'bg-ai-bubble rounded-tl-none';
            const roleText = isUser ? 'You' : 'Tutor';
            const roleColor = isUser ? 'text-primary' : 'text-secondary';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${bubbleClass}`;
            
            messageDiv.innerHTML = `
                <div class="max-w-xs md:max-w-md p-3 rounded-xl ${contentClass} text-gray-800 shadow-sm">
                    <p class="font-semibold ${roleColor} mb-1 text-sm">${roleText}</p>
                    <p>${text}</p>
                </div>
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /**
         * Sets the application UI state (loading, idle, recording)
         * @param {string} state 
         */
        function setAppState(state) {
            isProcessing = state === 'loading' || state === 'tts_loading' || state === 'processing_audio';
            isRecording = state === 'recording';
            
            // --- Input and Send Button Management ---
            chatInput.disabled = isProcessing || isRecording;
            sendButton.disabled = isProcessing || isRecording || chatInput.value.trim() === '';
            sendLoading.classList.toggle('hidden', state !== 'loading' && state !== 'tts_loading' && state !== 'processing_audio');
            
            if (state === 'loading') {
                sendButtonText.textContent = 'Generating Text...';
            } else if (state === 'tts_loading') {
                sendButtonText.textContent = 'Generating Speech...';
            } else if (state === 'processing_audio') {
                sendButtonText.textContent = 'Transcribing Audio...';
            } else {
                sendButtonText.textContent = 'Send Message';
            }
            
            // --- Mic Button Management ---
            micButton.disabled = isProcessing || isReviewing;
            micIcon.classList.toggle('hidden', state === 'requesting_mic' || state === 'processing_audio');
            micLoading.classList.toggle('hidden', state !== 'requesting_mic' && state !== 'processing_audio');
            micButton.classList.toggle('bg-red-500', !isRecording);
            micButton.classList.toggle('hover:bg-red-600', !isRecording);
            micButton.classList.toggle('bg-primary', isRecording);
            micButton.classList.toggle('hover:bg-indigo-700', isRecording);
            
            // --- Review Button Management (Show only when audio is recorded and transcription is done) ---
            const hasRecordedAudio = recordedBlob !== null;
            reviewButton.classList.toggle('hidden', !hasRecordedAudio);
            reviewButton.disabled = isProcessing || isRecording;
            reviewButton.style.display = hasRecordedAudio ? 'flex' : 'none';

            // If audio is present, increase send button size to fill remaining space
            sendButton.classList.toggle('w-4/5', !hasRecordedAudio);
            sendButton.classList.toggle('w-2/5', hasRecordedAudio);

            // --- Status and Error Management ---
            inputStatus.textContent = '';
            errorFeedback.classList.add('hidden');
            
            if (state === 'recording') {
                inputStatus.textContent = 'Recording... Click mic to stop.';
                micIcon.classList.add('animate-pulse-mic');
            } else if (state === 'tts_loading') {
                 inputStatus.textContent = 'Preparing audio...';
            } else if (state === 'processing_audio') {
                 inputStatus.textContent = 'Processing your voice...';
            } else {
                micIcon.classList.remove('animate-pulse-mic');
            }
        }
        
        /**
         * Resets all audio/recording related state.
         */
        function resetRecordingState() {
            cleanupAudioResources();
            recordedChunks = [];
            recordedBlob = null;
            recordedAudioUrl = null;
            isReviewing = false;
        }

        /**
         * Clears all active audio resources.
         */
        function cleanupAudioResources() {
             if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
             if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }
        }

        /**
         * Processes the recorded audio blob for transcription via Gemini.
         */
        async function processAudioForTranscription(audioBlob) {
            setAppState('processing_audio');
            
            try {
                const base64Audio = await blobToBase64(audioBlob);
                
                const payload = {
                    contents: [
                        { 
                            parts: [
                                { text: "Transcribe the following audio recording and return ONLY the resulting text. Do not add any greetings, explanations, or punctuation other than what is spoken." },
                                {
                                    inlineData: {
                                        mimeType: audioBlob.type,
                                        data: base64Audio
                                    }
                                }
                            ]
                        }
                    ],
                };
                
                const response = await fetchWithRetry(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const transcript = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

                if (transcript) {
                    chatInput.value = transcript;
                    inputStatus.textContent = "Transcription ready. Review your audio or send the message.";
                } else {
                    errorFeedback.textContent = "Could not transcribe audio. Please try recording again.";
                    errorFeedback.classList.remove('hidden');
                    resetRecordingState();
                }

            } catch (error) {
                console.error("Transcription Error:", error);
                errorFeedback.textContent = `Transcription Error: ${error.message}.`;
                errorFeedback.classList.remove('hidden');
                resetRecordingState();
            } finally {
                setAppState('idle');
            }
        }
        
        /**
         * Handles the click event for the microphone button (start/stop recording).
         */
        async function handleMicClick() {
            if (isRecording) {
                // STOP recording
                if (mediaRecorder) {
                    mediaRecorder.stop();
                    setAppState('processing_audio');
                }
                return;
            }

            if (isProcessing) return;

            // START recording
            resetRecordingState();
            setAppState('requesting_mic'); 

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recordedChunks = [];

                mediaRecorder = new MediaRecorder(audioStream);

                mediaRecorder.ondataavailable = (event) => {
                    recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    // 1. Create the Blob for playback/API
                    recordedBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recordedAudioUrl = URL.createObjectURL(recordedBlob);
                    
                    // 2. Transcribe the audio
                    processAudioForTranscription(recordedBlob);
                    
                    // 3. Cleanup stream resources (recorder will be stopped by stop() call)
                    audioStream.getTracks().forEach(track => track.stop());
                    audioStream = null;
                };

                mediaRecorder.start();
                setAppState('recording');

            } catch (err) {
                console.error('Microphone access denied or error:', err);
                errorFeedback.textContent = "Microphone access denied. Please allow it and try again.";
                errorFeedback.classList.remove('hidden');
                setAppState('idle'); 
            }
        }

        /**
         * Calls the TTS API to generate and play audio for the tutor's response.
         */
        async function playTutorAudio(text) {
            setAppState('tts_loading');
            cleanupAudioResources(); 

            const payload = {
                contents: [{ parts: [{ text: `Say in a clear, friendly voice: ${text}` }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: TTS_VOICE }
                        }
                    }
                },
                model: TTS_MODEL
            };

            try {
                const response = await fetchWithRetry(TTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    
                    const audioUrl = URL.createObjectURL(wavBlob);
                    audioPlayer = new Audio(audioUrl);
                    
                    audioPlayer.onended = () => {
                        setAppState('idle');
                        URL.revokeObjectURL(audioUrl);
                        audioPlayer = null;
                    };

                    audioPlayer.onerror = (e) => {
                         console.error("Audio playback error:", e);
                         errorFeedback.textContent = "Tutor audio playback failed.";
                         errorFeedback.classList.remove('hidden');
                         setAppState('idle');
                    };

                    audioPlayer.play().catch(e => {
                         console.warn("Tutor audio blocked. Click to enable.");
                         setAppState('idle');
                    });

                } else {
                    throw new Error("TTS response was incomplete or format was wrong.");
                }

            } catch (error) {
                console.error("TTS Error:", error);
                errorFeedback.textContent = `TTS Error: Could not generate audio. (${error.message})`;
                errorFeedback.classList.remove('hidden');
                setAppState('idle');
            }
        }

        /**
         * Generates the LLM response (text) based on current chat history.
         */
        async function getTutorResponse() {
            setAppState('loading');
            
            const systemInstruction = `You are a friendly, highly skilled native English conversation tutor.
                Your primary goal is to help the user practice speaking and writing in natural, idiomatic English.
                For every user turn:
                1. Provide **natural, gentle corrections or suggestions** for any unnatural phrasing the user uses.
                2. Respond **naturally** to their message, keeping the conversation engaging.
                3. **ALWAYS ask a relevant follow-up question** to keep the dialogue flowing.
                4. Keep your responses concise (3-5 sentences maximum).
                5. Do not use markdown (like bolding or lists) in your response.`;

            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemInstruction }] },
            };

            try {
                const response = await fetchWithRetry(LLM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const tutorText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (tutorText) {
                    displayMessage('model', tutorText);
                    await playTutorAudio(tutorText);
                } else {
                    throw new Error("Received an empty response from the Language Model.");
                }

            } catch (error) {
                console.error("LLM Error:", error);
                errorFeedback.textContent = `Error: Could not get a response from the tutor. (${error.message})`;
                errorFeedback.classList.remove('hidden');
                chatHistory.pop(); 
                setAppState('idle');
            } finally {
                sendButton.disabled = chatInput.value.trim() === '';
            }
        }

        /**
         * Main function to handle sending user input.
         */
        function sendUserMessage(userText) {
            userText = userText.trim();
            if (!userText || isProcessing) return;

            // Clear any recorded audio state, as the message is now sent
            resetRecordingState();

            // 1. Display user message
            displayMessage('user', userText);

            // 2. Add to history
            chatHistory.push({ role: 'user', parts: [{ text: userText }] });

            // 3. Clear input
            chatInput.value = '';
            sendButton.disabled = true;

            // 4. Get AI response (which includes TTS)
            getTutorResponse();
        }
        
        /**
         * Handles the Review/Listen button click.
         */
        function handleReviewClick() {
            if (!recordedAudioUrl || isProcessing || isRecording) return;
            
            // Stop any ongoing playback
            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
                setAppState('idle');
                isReviewing = false;
                return;
            }

            // Start playback
            isReviewing = true;
            setAppState('idle'); // Just to update button state

            audioPlayer = new Audio(recordedAudioUrl);
            
            audioPlayer.onplay = () => {
                inputStatus.textContent = "Playing back your recording...";
                reviewButton.classList.remove('bg-secondary');
                reviewButton.classList.add('bg-red-500');
            }

            audioPlayer.onended = () => {
                inputStatus.textContent = "Playback finished.";
                reviewButton.classList.add('bg-secondary');
                reviewButton.classList.remove('bg-red-500');
                isReviewing = false;
                audioPlayer = null;
                setAppState('idle'); 
            };
            
            audioPlayer.onerror = (e) => {
                 console.error("Playback error:", e);
                 inputStatus.textContent = "Playback error occurred.";
                 reviewButton.classList.add('bg-secondary');
                 reviewButton.classList.remove('bg-red-500');
                 isReviewing = false;
                 audioPlayer = null;
                 setAppState('idle'); 
            }

            audioPlayer.play().catch(e => {
                console.warn("Playback blocked:", e);
                inputStatus.textContent = "Playback requires a user interaction first.";
                isReviewing = false;
                setAppState('idle');
            });
        }


        // --- Event Listeners ---

        micButton.addEventListener('click', handleMicClick);
        reviewButton.addEventListener('click', handleReviewClick); // New Listener

        sendButton.addEventListener('click', () => {
            sendUserMessage(chatInput.value);
        });

        chatInput.addEventListener('input', () => {
            sendButton.disabled = chatInput.value.trim() === '' || isProcessing || isRecording;
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendButton.disabled) {
                    sendUserMessage(chatInput.value);
                }
            }
        });


        // --- UTILITIES ---

        async function fetchWithRetry(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return response;
                    const errorDetails = await response.text();
                    console.error(`Attempt ${i + 1} failed. Status: ${response.status}. URL: ${url}. Details:`, errorDetails);
                    
                    if (response.status === 403) {
                         throw new Error(`Authorization Failed (403 Forbidden). Ensure the API key is valid.`);
                    }
                    if ((response.status === 429 || response.status >= 500) && i < maxRetries - 1) {
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    }
                    throw new Error(`API Request Failed: ${response.status} ${response.statusText}`);
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Exceeded maximum retries.");
        }


        // Initialize on load
        window.onload = () => {
            // Note: Native SpeechRecognition removed, replaced by MediaRecorder/Gemini multimodal
            setAppState('idle'); 
        };
    </script>
</body>
